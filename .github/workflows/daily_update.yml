name: Daily EDF Price Fetcher

on:
  schedule:
    # 英國時間 (BST) 的 16:15 等於 UTC 時間的 15:15
    - cron: '15 15 * * *' 
  workflow_dispatch: # 允許你隨時手動點擊按鈕執行

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 google-genai pydantic

      - name: Run AI Agent script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python edf_agent.py

      - name: Commit and push updated JSON
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add prices.json
          git commit -m "Automated daily price update" || exit 0
          git push
